[package]
name = "xurcroh-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "xurcroh_quic"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
quinn = { version = "0.11.6", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = "0.13.2"
rustls = { version = "0.23.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.8"
thiserror = "1.0.69"
tokio = { version = "1.43.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
xurcroh-crypto = { path = "../crypto" }
xurcroh-protocol = { path = "../protocol" }
pyo3 = { version = "0.30.1", features = ["extension-module"], optional = true }

[dev-dependencies]
tokio = { version = "1.43.0", features = ["full"] }
