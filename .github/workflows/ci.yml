name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: ./scripts/bootstrap-python.sh
      - name: Format and lint
        run: |
          .venv/bin/ruff format --check python benchmarks tests examples
          .venv/bin/ruff check python benchmarks tests examples
          .venv/bin/mypy
      - name: Build native transport bindings
        run: .venv/bin/maturin develop --manifest-path crates/transport/Cargo.toml --features python
      - name: Build Python and native wheels
        run: ./scripts/build-wheels.sh
      - name: Test
        run: .venv/bin/pytest --cov --cov-report=xml -m 'not hardware'
      - name: Fuzz quantized checkpoint readers
        run: |
          .venv/bin/python scripts/formats/generate_gguf_fixtures.py /tmp/xurcroh-fuzz
          .venv/bin/python scripts/formats/fuzz_readers.py /tmp/xurcroh-fuzz/q4_0.gguf --iterations 100
      - name: Audit dependencies
        run: .venv/bin/pip-audit

  reproducibility:
    runs-on: ubuntu-24.04
    env:
      XURCROH_REPRODUCIBLE_DIST: /tmp/xurcroh-reproducible-wheels
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compare independent clean wheel builds
        run: ./scripts/reproducible-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-wheels
          path: /tmp/xurcroh-reproducible-wheels/*.whl
          retention-days: 1

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-manual/package-lock.json
      - run: npm ci
        working-directory: apps/web-manual
      - run: npm run check
        working-directory: apps/web-manual
      - run: npm audit
        working-directory: apps/web-manual

  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: Install ProVerif
        run: opam install proverif --yes
      - name: Verify the Fortress session models
        run: |
          set -o pipefail
          for model in fortress_session fortress_role_session; do
            opam exec -- proverif "protocol/${model}.pv" | python3 scripts/check_proverif.py
          done
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke-fuzz protocol parsers and cryptographic decoders
        run: |
          for target in frame_decode aead_open hpke_open; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -timeout=10
          done

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install client dependencies
        run: ./scripts/bootstrap-python.sh
      - name: Build native client bindings
        run: .venv/bin/maturin develop --manifest-path crates/transport/Cargo.toml --features python
      - name: Build and smoke-test the sealed worker image
        run: .venv/bin/python scripts/fortress/container_smoke.py
      - name: Record image identity
        run: docker image inspect --format '{{.Id}}' xurcroh-fortress-worker:local > container-image-digest.txt
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: xurcroh-fortress-worker:local
          format: cyclonedx-json
          output-file: fortress-worker-sbom.json
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: xurcroh-fortress-worker:local
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-worker-image-evidence
          path: |
            container-image-digest.txt
            fortress-worker-sbom.json
          retention-days: 1
