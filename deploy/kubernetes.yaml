apiVersion: v1
kind: Namespace
metadata:
  name: xurcroh
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-checkpoints
  namespace: xurcroh
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: CHECKPOINT_STORAGE_CLASS
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: xurcroh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: controller}
  template:
    metadata:
      labels: {app: controller}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: controller
          image: xurcroh:0.1.0
          imagePullPolicy: IfNotPresent
          command: [uvicorn, xurcroh.controller.service:create_controller_app, --factory, --host, 0.0.0.0, --port, "9443", --ssl-certfile, /tls/tls.crt, --ssl-keyfile, /tls/tls.key]
          ports: [{containerPort: 9443}]
          readinessProbe: {httpGet: {path: /health, port: 9443, scheme: HTTPS}}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          env:
            - {name: SSL_CERT_FILE, value: /tls/tls.crt}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: runtime, mountPath: /runtime-data}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret: {secretName: xurcroh-controller-tls}
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: xurcroh
spec:
  selector: {app: controller}
  ports: [{port: 9443, targetPort: 9443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-a
  namespace: xurcroh
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: worker-a}
  template:
    metadata:
      labels: {app: worker-a}
    spec: &worker-spec
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: worker
          image: xurcroh:0.1.0
          args:
            - --worker-id=worker-a
            - --model=qwen-7b=/models/qwen-7b
            - --host=0.0.0.0
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --controller=https://controller:9443
            - --advertised-endpoint=https://worker-a:9443
          ports: [{containerPort: 9443}]
          readinessProbe: {httpGet: {path: /health, port: 9443, scheme: HTTPS}}
          resources:
            requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 128Gi, nvidia.com/gpu: "1"}
          env:
            - {name: SSL_CERT_FILE, value: /tls/tls.crt}
            - {name: CUDA_VISIBLE_DEVICES, value: "0"}
          volumeMounts: &worker-mounts
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: models, mountPath: /models, readOnly: true}
            - {name: runtime, mountPath: /runtime-data}
            - {name: torch-cache, mountPath: /home/xurcroh/.cache}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes: &worker-volumes
        - name: tls
          secret: {secretName: xurcroh-worker-a-tls}
        - name: models
          persistentVolumeClaim: {claimName: model-checkpoints, readOnly: true}
        - name: runtime
          emptyDir: {}
        - name: torch-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-a
  namespace: xurcroh
spec:
  selector: {app: worker-a}
  ports: [{port: 9443, targetPort: 9443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-b
  namespace: xurcroh
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: worker-b}
  template:
    metadata:
      labels: {app: worker-b}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: worker
          image: xurcroh:0.1.0
          args:
            - --worker-id=worker-b
            - --model=qwen-7b=/models/qwen-7b
            - --host=0.0.0.0
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --controller=https://controller:9443
            - --advertised-endpoint=https://worker-b:9443
          ports: [{containerPort: 9443}]
          readinessProbe: {httpGet: {path: /health, port: 9443, scheme: HTTPS}}
          resources:
            requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 128Gi, nvidia.com/gpu: "1"}
          env:
            - {name: SSL_CERT_FILE, value: /tls/tls.crt}
            - {name: CUDA_VISIBLE_DEVICES, value: "0"}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: models, mountPath: /models, readOnly: true}
            - {name: runtime, mountPath: /runtime-data}
            - {name: torch-cache, mountPath: /home/xurcroh/.cache}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tls
          secret: {secretName: xurcroh-worker-b-tls}
        - name: models
          persistentVolumeClaim: {claimName: model-checkpoints, readOnly: true}
        - name: runtime
          emptyDir: {}
        - name: torch-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-b
  namespace: xurcroh
spec:
  selector: {app: worker-b}
  ports: [{port: 9443, targetPort: 9443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xurcroh-data-plane
  namespace: xurcroh
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: xurcroh}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: xurcroh}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
